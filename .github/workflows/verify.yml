name: Verify TavernQuest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  room-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Prepare disposable Firebase configuration
        run: python3 scripts/prepare-ci.py
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Room migrations and cache reset
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.luminor.tavernquest.data.local --console=plain
  android-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Prepare disposable CI signing and Firebase configuration
        run: python3 scripts/prepare-ci.py
      - name: Clean build outputs
        run: ./gradlew clean --console=plain
      - name: Lint production build
        run: ./gradlew :app:lintProdRelease --console=plain
      - name: Test Android production unit tests
        run: ./gradlew :app:testProdReleaseUnitTest --console=plain
      - name: Build production release code with disposable CI certificate
        run: ./gradlew :app:assembleProdRelease --console=plain
      - name: Test Firestore and Storage production rules
        working-directory: firebase/tests
        run: |
          npm ci
          npm run test:rules
      - name: Install Functions test dependencies
        working-directory: firebase/functions
        run: npm ci
      - name: Test account handlers against Firestore Emulator
        working-directory: firebase/tests
        env:
          GCLOUD_PROJECT: demo-tavernquest
        run: npm run test:accounts
