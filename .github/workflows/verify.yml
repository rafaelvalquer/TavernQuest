name: Verify TavernQuest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Lint production build
        run: ./gradlew :app:lintProdDebug --console=plain
      - name: Test Android production unit tests
        run: ./gradlew :app:testProdDebugUnitTest --console=plain
      - name: Build production debug APK
        run: ./gradlew :app:assembleProdDebug --console=plain
      - name: Test Firestore and Storage production rules
        working-directory: firebase/tests
        run: |
          npm ci
          npm run test:rules
